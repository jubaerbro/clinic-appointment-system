<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Clinic{% endblock %} · Clinic Appointment System</title>
  <style>
    :root { --ink:#1d2a33; --muted:#5d6b75; --line:#dfe5ea; --brand:#0f766e; --bg:#f6f8f9; --bad:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); }
    nav { max-width:960px; margin:auto; display:flex; gap:18px; align-items:center; padding:14px 20px; flex-wrap:wrap; }
    nav .logo { font-weight:700; color:var(--brand); margin-right:auto; text-decoration:none; }
    nav a { color:var(--muted); text-decoration:none; font-size:15px; }
    nav a:hover { color:var(--ink); }
    main { max-width:960px; margin:24px auto; padding:0 20px; }
    h1 { font-size:24px; margin:0 0 16px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:20px; }
    form.inline { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
    label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); gap:4px; }
    input, select { padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:15px; min-width:140px; }
    button { padding:9px 14px; border:0; border-radius:6px; background:var(--brand); color:#fff; font-size:14px; cursor:pointer; }
    button.secondary { background:#fff; color:var(--bad); border:1px solid var(--line); }
    table { width:100%; border-collapse:collapse; font-size:15px; }
    th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:13px; }
    .error { background:#fef3f2; color:var(--bad); border:1px solid #fecdca; padding:10px 12px; border-radius:6px; margin-bottom:14px; }
    .tag { font-size:12px; padding:2px 8px; border-radius:99px; background:#ecfdf3; color:#067647; }
    .tag.unpaid, .tag.cancelled, .tag.failed { background:#fef3f2; color:var(--bad); }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; }
    .stats .num { font-size:32px; font-weight:700; }
    .empty { color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="logo" href="/">Clinic</a>
      <a href="/patients">Patients</a>
      <a href="/doctors">Doctors</a>
      <a href="/appointments">Appointments</a>
      <a href="/bills">Billing</a>
      <a href="/notifications">Notifications</a>
      <a href="/apidocs/">API docs</a>
    </nav>
  </header>
  <main>
    {% if error %}<div class="error" id="error">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
