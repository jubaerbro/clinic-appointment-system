# OpenAPI 3 description of the Clinic API.
# Swagger UI (via the flasgger package) turns this file into the
# interactive page at /apidocs, where every endpoint can be tried out.
# tests/test_api_docs.py checks that this file is valid and that every
# /api route in the code is documented here.
openapi: 3.0.3
info:
  title: Clinic Appointment System API
  version: 1.0.0
  description: >
    JSON API for the clinic: patients, doctors, appointments, billing and
    notifications. Errors always come back as {"error": "message"}.
tags:
  - name: Patients
  - name: Doctors
  - name: Appointments
  - name: Billing
  - name: Notifications

paths:
  /api/patients:
    get:
      tags: [Patients]
      summary: List all patients
      responses:
        "200":
          description: All patients, sorted by name
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Patient"}
    post:
      tags: [Patients]
      summary: Register a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewPatient"}
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Patient"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/patients/{patient_id}:
    get:
      tags: [Patients]
      summary: Get one patient
      parameters:
        - name: patient_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: The patient
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Patient"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/doctors:
    get:
      tags: [Doctors]
      summary: List all doctors
      responses:
        "200":
          description: All doctors, sorted by name
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Doctor"}
    post:
      tags: [Doctors]
      summary: Add a doctor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewDoctor"}
      responses:
        "201":
          description: Doctor created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Doctor"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/appointments:
    get:
      tags: [Appointments]
      summary: List all appointments
      responses:
        "200":
          description: All appointments with patient and doctor names
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Appointment"}
    post:
      tags: [Appointments]
      summary: Book an appointment
      description: >
        Fails with 400 if the date is in the past, the time is not a clinic
        slot, or the doctor is already booked at that time.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewAppointment"}
      responses:
        "201":
          description: Appointment booked (the patient is notified)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Appointment"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/appointments/{appointment_id}/cancel:
    post:
      tags: [Appointments]
      summary: Cancel an appointment
      parameters:
        - name: appointment_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: Appointment cancelled (the patient is notified)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Appointment"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/bills:
    get:
      tags: [Billing]
      summary: List all bills
      responses:
        "200":
          description: All bills, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Bill"}
    post:
      tags: [Billing]
      summary: Create a bill for an appointment
      description: >
        The amount depends on the patient's age (Strategy pattern):
        60+ pays 70% of the fee, under 12 pays 80%, everyone else 100%.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointment_id]
              properties:
                appointment_id: {type: integer, example: 1}
      responses:
        "201":
          description: Bill created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/bills/{bill_id}/pay:
    post:
      tags: [Billing]
      summary: Pay a bill through the payment gateway
      parameters:
        - name: bill_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: Bill paid
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Bill"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "402":
          description: Payment declined by the gateway
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/notifications:
    get:
      tags: [Notifications]
      summary: List all notifications sent to patients
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Notification"}

components:
  responses:
    BadRequest:
      description: The request data broke a rule
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: The item does not exist
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      properties:
        error: {type: string, example: "Name is required"}

    NewPatient:
      type: object
      required: [name, age]
      properties:
        name: {type: string, example: "Rahim Uddin"}
        phone: {type: string, example: "01711000000"}
        email: {type: string, example: "rahim@example.com"}
        age: {type: integer, minimum: 0, maximum: 120, example: 45}
    Patient:
      allOf:
        - $ref: "#/components/schemas/NewPatient"
        - type: object
          properties:
            id: {type: integer, example: 1}

    NewDoctor:
      type: object
      required: [name, specialty, fee]
      properties:
        name: {type: string, example: "Dr. Nasreen Akter"}
        specialty: {type: string, example: "Cardiology"}
        fee: {type: number, example: 800}
    Doctor:
      allOf:
        - $ref: "#/components/schemas/NewDoctor"
        - type: object
          properties:
            id: {type: integer, example: 1}

    NewAppointment:
      type: object
      required: [patient_id, doctor_id, date, time]
      properties:
        patient_id: {type: integer, example: 1}
        doctor_id: {type: integer, example: 1}
        date: {type: string, format: date, example: "2026-12-01"}
        time:
          type: string
          enum: ["09:00", "09:30", "10:00", "10:30", "11:00", "11:30",
                 "14:00", "14:30", "15:00", "15:30", "16:00", "16:30"]
    Appointment:
      type: object
      properties:
        id: {type: integer}
        patient_id: {type: integer}
        doctor_id: {type: integer}
        date: {type: string, format: date}
        time: {type: string}
        status: {type: string, enum: [booked, cancelled]}
        patient_name: {type: string, description: "Only in the list response"}
        doctor_name: {type: string, description: "Only in the list response"}

    Bill:
      type: object
      properties:
        id: {type: integer}
        appointment_id: {type: integer}
        amount: {type: number, example: 560}
        fee_type: {type: string, example: "senior (30% off)"}
        status: {type: string, enum: [unpaid, paid]}
        transaction_id: {type: string, nullable: true, example: "QP-1A2B3C4D"}

    Notification:
      type: object
      properties:
        id: {type: integer}
        patient_id: {type: integer}
        patient_name: {type: string}
        message: {type: string}
        email_status: {type: string, enum: [sent, failed, no-email]}
        created_at: {type: string}
